    <!-- Resolve the palette before the first paint, including on slow connections. -->
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem("nordra-theme"); } catch {}
        const dark = saved === "dark";
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <style>html{background:#f7f7f4;color-scheme:light}html.dark{background:#020816;color-scheme:dark}body{margin:0;background:inherit}</style>
