<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg"><title>Montaña en claro · Variantes</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf4fa;color:#193043;font:16px/1.5 system-ui}header{padding:20px 24px;border-bottom:1px solid #bacbdc;background:#f8fbfd}h1{font-size:24px;margin:0 0 8px}p{max-width:95ch;margin:8px 0}.controls{display:flex;flex-wrap:wrap;gap:12px 24px;margin:16px 0}select,button{font:inherit;padding:8px 12px;border:1px solid #849db8;border-radius:6px;background:white;color:inherit}select:focus-visible,button:focus-visible{outline:3px solid #2586a9;outline-offset:3px}.viewport{overflow:auto;padding:16px 0;display:grid;justify-items:center}.frame{position:relative}iframe{display:block;border:0;width:100%;height:100%}.loading{position:absolute;inset:0;display:grid;place-content:center;background:#edf4fa}.loading[hidden]{display:none}#status{min-height:24px;font-size:14px;color:#405b70}</style></head>
<body><header><h1>Montaña en tema claro</h1><p>Compara roca, glaciar y luz suave. Los retratos siguen siendo los aprobados: esta página espera al 3D para mostrar cada variante.</p>
<div class="controls"><label>Versión <select id="variant"><option value="0">Ronda 3 actual</option><option value="1">Gemela del oscuro</option><option value="2">Nieve de día</option><option value="3">Silueta suave</option></select></label><label>Tamaño <select id="size"><option value="1440">1440 × 900</option><option value="390">390 × 844</option></select></label><button id="pause" type="button" aria-pressed="true">Activar movimiento</button></div><p id="status" role="status" aria-live="polite"></p></header>
<main class="viewport"><div class="frame"></div></main>
<script>(()=>{const variant=document.querySelector('#variant'),size=document.querySelector('#size'),button=document.querySelector('#pause'),wrap=document.querySelector('.frame'),status=document.querySelector('#status');let paused=true,timer,generation=0;const q=new URLSearchParams(location.search);variant.value=['0','1','2','3'].includes(q.get('montana'))?q.get('montana'):'0';size.value=q.get('size')==='390'?'390':'1440';
function show(){clearTimeout(timer);const ticket=++generation,width=Number(size.value),height=width===390?844:900;wrap.style.width=width+'px';wrap.style.height=height+'px';wrap.replaceChildren();history.replaceState(null,'',location.pathname+'?'+new URLSearchParams({montana:variant.value,size:size.value}));const query=new URLSearchParams({theme:'light',motion:paused?'paused':'playing'});if(variant.value!=='0')query.set('montana',variant.value);const frame=document.createElement('iframe');frame.title=variant.selectedOptions[0].text;frame.src='/?'+query;const veil=document.createElement('div');veil.className='loading';veil.textContent='Preparando la montaña…';wrap.append(frame,veil);status.textContent=frame.title+' · '+width+' × '+height+' · '+(paused?'Quieto':'En movimiento');button.textContent=paused?'Activar movimiento':'Pausar movimiento';button.setAttribute('aria-pressed',String(paused));function ready(){if(ticket!==generation)return;const stage=frame.contentDocument?.querySelector('.horizon-landscape');if(stage?.dataset.renderer==='landscape-3d'){veil.hidden=true;return;}if(stage?.dataset.renderer==='static'){veil.textContent='WebGL no disponible: no se puede comparar la variante';return;}timer=setTimeout(ready,70);}frame.addEventListener('load',ready,{once:true});}
variant.addEventListener('change',show);size.addEventListener('change',show);button.onclick=()=>{paused=!paused;show();};show();})();</script></body></html>
